<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pencarian Dokumen PDF</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            army: {
              DEFAULT: '#4b5320',
              hover: '#3b4219',
              light: '#f1f5f0'
            }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-white text-gray-800 min-h-screen flex flex-col items-center justify-center p-6 antialiased">

  <!-- Kontainer Utama -->
  <main class="w-full max-w-xl flex flex-col items-center">
    
    <!-- Judul & Status -->
    <div class="text-center mb-8">
      <h1 class="text-3xl font-extrabold text-gray-900 tracking-tight mb-2">Pencarian Dokumen PDF</h1>
      <span id="status-badge" class="text-xs px-3 py-1 rounded-full bg-amber-100 text-amber-800 font-medium">Memuat Data...</span>
    </div>

    <!-- Form Pencarian -->
    <div class="w-full relative">
      <div class="flex gap-2">
        <div class="relative flex-1">
          <input 
            type="text" 
            id="search-input" 
            placeholder="Ketik nama lengkap atau sebagian nama..." 
            autocomplete="off"
            class="w-full rounded-xl border border-emerald-200 bg-emerald-50/40 focus:bg-white focus:border-emerald-500 focus:ring-2 focus:ring-emerald-200 px-4 py-3.5 text-base outline-none transition placeholder-gray-400 shadow-sm"
          >
        </div>
        <button 
          id="btn-search" 
          class="bg-army hover:bg-army-hover text-white font-semibold px-6 py-3.5 rounded-xl shadow-sm transition flex items-center gap-2 cursor-pointer"
        >
          <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
          </svg>
          <span>Cari</span>
        </button>
      </div>

      <!-- Pre-search Dropdown (1 Nama Terkait) -->
      <div id="presearch-box" class="absolute z-20 left-0 right-0 mt-2 bg-white border border-gray-200 rounded-xl shadow-lg hidden overflow-hidden">
        <div id="presearch-item" class="p-3.5 hover:bg-emerald-50/70 cursor-pointer flex items-center justify-between transition">
          <div class="flex items-center gap-2 overflow-hidden">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-emerald-600 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
            </svg>
            <span id="presearch-name" class="font-medium text-gray-800 text-sm truncate">Nama</span>
          </div>
          <span id="presearch-range" class="text-xs bg-emerald-100 text-emerald-800 font-semibold px-2.5 py-1 rounded-full whitespace-nowrap ml-3 shrink-0">
            Hal - s/d -
          </span>
        </div>
      </div>
    </div>

    <!-- Kartu Hasil Pencarian & Tombol Unduh -->
    <div id="result-card" class="w-full mt-6 bg-white border border-gray-200 rounded-2xl p-5 shadow-sm hidden">
      <div class="flex flex-col sm:flex-row items-center justify-between gap-4">
        <div>
          <p class="text-xs text-gray-500 uppercase font-semibold">Dokumen Ditemukan</p>
          <h2 id="result-name" class="text-lg font-bold text-gray-900 mt-0.5">-</h2>
          <p class="text-xs text-emerald-800 mt-1">
            Rentang Halaman: <b id="result-range" class="text-gray-900">-</b> (<span id="result-count">0</span> halaman)
          </p>
        </div>

        <button id="btn-download" class="w-full sm:w-auto bg-army hover:bg-army-hover text-white text-sm font-semibold px-5 py-3 rounded-xl shadow-sm transition flex items-center justify-center gap-2 cursor-pointer shrink-0">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a2 2 0 002 2h12a2 2 0 002-2v-1M7 10l5 5m0 0l5-5m-5 5V3" />
          </svg>
          <span id="download-label">Unduh PDF</span>
        </button>
      </div>
    </div>

  </main>

  <script>
    let dataset = [];
    let currentSelected = null;
    let debounceTimer = null;

    const statusBadge = document.getElementById("status-badge");
    const searchInput = document.getElementById("search-input");
    const btnSearch = document.getElementById("btn-search");
    const presearchBox = document.getElementById("presearch-box");
    const presearchItem = document.getElementById("presearch-item");
    const presearchName = document.getElementById("presearch-name");
    const presearchRange = document.getElementById("presearch-range");

    const resultCard = document.getElementById("result-card");
    const resultName = document.getElementById("result-name");
    const resultRange = document.getElementById("result-range");
    const resultCount = document.getElementById("result-count");
    const btnDownload = document.getElementById("btn-download");

    // 1. Muat file data_drive.json hasil split
    fetch("data_drive.json")
      .then(res => {
        if (!res.ok) throw new Error("File data_drive.json tidak ditemukan.");
        return res.json();
      })
      .then(data => {
        dataset = data;
        statusBadge.textContent = `${dataset.length} Data Siap Dicari`;
        statusBadge.className = "text-xs px-3 py-1 rounded-full bg-emerald-100 text-emerald-800 font-medium";
      })
      .catch(err => {
        console.error(err);
        statusBadge.textContent = "Gagal Memuat data_drive.json";
        statusBadge.className = "text-xs px-3 py-1 rounded-full bg-red-100 text-red-800 font-medium";
      });

    // 2. Fungsi Pencocokan Nama Cepat
    function findBestMatch(query) {
      const q = query.trim().toLowerCase();
      if (!q) return null;

      // Cari nama yang mengandung kata kunci ketikan
      for (let i = 0; i < dataset.length; i++) {
        const item = dataset[i];
        if (item.nama.toLowerCase().includes(q)) {
          return item;
        }
      }
      return null;
    }

    // 3. Pre-search dengan Debounce
    searchInput.addEventListener("input", (e) => {
      clearTimeout(debounceTimer);
      const val = e.target.value.trim();

      if (val.length < 2) {
        presearchBox.classList.add("hidden");
        return;
      }

      debounceTimer = setTimeout(() => {
        const match = findBestMatch(val);
        if (match) {
          currentSelected = match;
          presearchName.textContent = match.nama;
          presearchRange.textContent = `Hal ${match.start_page} s/d ${match.end_page}`;
          presearchBox.classList.remove("hidden");
        } else {
          presearchBox.classList.add("hidden");
        }
      }, 200);
    });

    // Klik pada Pre-search Item
    presearchItem.addEventListener("mousedown", () => {
      if (!currentSelected) return;
      searchInput.value = currentSelected.nama;
      presearchBox.classList.add("hidden");
      showResultCard(currentSelected);
    });

    // Tutup Pre-search jika klik di luar
    document.addEventListener("click", (e) => {
      if (!searchInput.contains(e.target) && !presearchBox.contains(e.target)) {
        presearchBox.classList.add("hidden");
      }
    });

    // Tombol Cari & Tombol Enter
    btnSearch.addEventListener("click", executeSearch);
    searchInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        clearTimeout(debounceTimer);
        presearchBox.classList.add("hidden");
        executeSearch();
      }
    });

    function executeSearch() {
      const val = searchInput.value.trim();
      if (!val) return;

      const match = findBestMatch(val);
      if (match) {
        currentSelected = match;
        showResultCard(match);
      } else {
        alert(`Nama "${val}" tidak ditemukan dalam daftar.`);
        resultCard.classList.add("hidden");
      }
    }

    function showResultCard(item) {
      resultName.textContent = item.nama;
      resultRange.textContent = `Hal ${item.start_page} s/d ${item.end_page}`;
      resultCount.textContent = item.total_halaman;
      resultCard.classList.remove("hidden");
    }

    // 4. Unduh File Statis dari Folder hasil_split
    btnDownload.addEventListener("click", () => {
      if (!currentSelected || !currentSelected.file_name) return;

      // Mengarah ke path folder hasil_split/
      const downloadPath = `hasil_split/${encodeURIComponent(currentSelected.file_name)}`;

      const link = document.createElement("a");
      link.href = downloadPath;
      link.download = currentSelected.file_name;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    });
  </script>
</body>
</html>
